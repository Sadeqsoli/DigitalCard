name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://digitalcard:digitalcard@localhost:5432/digitalcard_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: digitalcard_test
          POSTGRES_USER: digitalcard
          POSTGRES_PASSWORD: digitalcard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalcard -d digitalcard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Database integration tests
        run: pnpm --filter @digitalcard/database db:test

      - name: Build
        run: pnpm build
